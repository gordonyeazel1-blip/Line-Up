<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Lineup Builder</title>
<link rel="icon" href="data:," />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Lineup" />
<meta name="theme-color" content="#022c22" />
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap');
  html, body {
    background-color: #022c22;
    overscroll-behavior-y: none;
    margin: 0;
  }
  * { -webkit-tap-highlight-color: transparent; }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef } = React;

const STORAGE_KEY = 'lineup-builder-roster';
const TIERS = ['A', 'B', 'C'];
const TIER_LABEL = { A: 'Best', B: 'Second Best', C: 'Third Best' };
const TIER_BADGE_CLASS = {
  A: 'bg-amber-400 text-emerald-800',
  B: 'bg-stone-300 text-emerald-800',
  C: 'bg-orange-700 text-stone-100',
};
const TIER_HEADER_CLASS = {
  A: 'text-amber-400',
  B: 'text-stone-300',
  C: 'text-orange-500',
};

// Simple inline icon glyphs so this file has zero external icon dependency.
const Icon = ({ children, className }) => (
  <span className={`inline-flex items-center justify-center leading-none ${className || ''}`}>{children}</span>
);

function makeId() {
  return typeof crypto !== 'undefined' && crypto.randomUUID
    ? crypto.randomUUID()
    : `${Date.now()}-${Math.random().toString(36).slice(2)}`;
}

function getColumnAt(x, y) {
  const el = document.elementFromPoint(x, y);
  if (!el) return null;
  const col = el.closest('[data-column]');
  return col ? col.getAttribute('data-column') : null;
}

function loadRoster() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return [];
    const parsed = JSON.parse(raw);
    if (Array.isArray(parsed.players)) {
      return parsed.players.map((p) => ({ tier: 'B', ...p }));
    }
    return [];
  } catch (e) {
    console.error('Failed to load roster', e);
    return [];
  }
}

function saveRoster(players) {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({ players }));
    return true;
  } catch (e) {
    console.error('Failed to save roster', e);
    return false;
  }
}

function RosterBuilder() {
  const [players, setPlayers] = useState(() => loadRoster());
  const [newName, setNewName] = useState('');
  const [newTier, setNewTier] = useState('A');
  const [draggingPlayer, setDraggingPlayer] = useState(null);
  const [copyState, setCopyState] = useState('idle');
  const [showImport, setShowImport] = useState(false);
  const [importText, setImportText] = useState('');
  const [foursomes, setFoursomes] = useState([]);
  const [sheetCopyState, setSheetCopyState] = useState('idle');

  const ghostRef = useRef(null);
  const startRef = useRef(null);
  const availableColRef = useRef(null);
  const playingColRef = useRef(null);

  // Real, synchronous, reliable persistence — every change saves immediately.
  useEffect(() => {
    saveRoster(players);
  }, [players]);

  function buildRosterText() {
    return players.map((p) => `${p.tier} | ${p.name} | ${p.status}`).join('\n');
  }

  function parseRosterText(text) {
    const rows = text
      .split('\n')
      .map((l) => l.trim())
      .filter(Boolean)
      .map((l) => {
        const parts = l.split('|').map((s) => s.trim());
        if (parts.length !== 3) return null;
        const [tier, name, status] = parts;
        if (!TIERS.includes(tier) || !name) return null;
        return { tier, name, status: status === 'playing' ? 'playing' : 'available' };
      })
      .filter(Boolean);
    return rows.map((r, i) => ({ id: makeId(), number: i + 1, ...r }));
  }

  async function copyRoster() {
    const text = buildRosterText();
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        await navigator.clipboard.writeText(text);
      } else {
        throw new Error('Clipboard API unavailable');
      }
      setCopyState('copied');
      setTimeout(() => setCopyState('idle'), 2000);
    } catch (e) {
      console.error('Copy failed', e);
      setCopyState('error');
      setTimeout(() => setCopyState('idle'), 3000);
    }
  }

  function movePlayer(id, status) {
    setPlayers((prev) => prev.map((p) => (p.id === id ? { ...p, status } : p)));
  }

  function cycleTier(id) {
    setPlayers((prev) =>
      prev.map((p) => {
        if (p.id !== id) return p;
        const next = TIERS[(TIERS.indexOf(p.tier) + 1) % TIERS.length];
        return { ...p, tier: next };
      })
    );
  }

  function addPlayer() {
    const name = newName.trim();
    if (!name) return;
    setPlayers((prev) => {
      const nextNumber = prev.length ? Math.max(...prev.map((p) => p.number)) + 1 : 1;
      return [...prev, { id: makeId(), name, number: nextNumber, status: 'available', tier: newTier }];
    });
    setNewName('');
  }

  function buildFoursomes(playingPlayers) {
    const sorted = [...playingPlayers].sort(
      (a, b) => TIERS.indexOf(a.tier) - TIERS.indexOf(b.tier) || a.number - b.number
    );
    const groupCount = Math.ceil(sorted.length / 4);
    if (groupCount === 0) return [];
    const groups = Array.from({ length: groupCount }, () => []);
    sorted.forEach((p, i) => groups[i % groupCount].push(p));
    return groups;
  }

  function refreshFoursomes() {
    setFoursomes(buildFoursomes(playing));
  }

  function buildSheetText() {
    const lines = ['ROSTER SHEET'];
    foursomes.forEach((group, idx) => {
      lines.push('', `Foursome ${idx + 1}`);
      group.forEach((p) => lines.push(`  ${p.name} (${p.tier})`));
    });
    return lines.join('\n');
  }

  async function copySheet() {
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        await navigator.clipboard.writeText(buildSheetText());
      } else {
        throw new Error('Clipboard API unavailable');
      }
      setSheetCopyState('copied');
      setTimeout(() => setSheetCopyState('idle'), 2000);
    } catch (e) {
      console.error('Copy failed', e);
      setSheetCopyState('error');
      setTimeout(() => setSheetCopyState('idle'), 3000);
    }
  }

  function removePlayer(id) {
    setPlayers((prev) => prev.filter((p) => p.id !== id));
  }

  function restoreFromText() {
    const restored = parseRosterText(importText);
    if (restored.length === 0) {
      setCopyState('error');
      setTimeout(() => setCopyState('idle'), 3000);
      return;
    }
    setPlayers(restored);
    setImportText('');
    setShowImport(false);
  }

  function resetAll() {
    if (players.length === 0) return;
    if (window.confirm('Clear the entire roster? This removes every player.')) {
      setPlayers([]);
      setFoursomes([]);
    }
  }

  function setColumnHighlight(col) {
    const apply = (ref, active) => {
      if (!ref.current) return;
      ref.current.classList.toggle('ring-2', active);
      ref.current.classList.toggle('ring-amber-400', active);
      ref.current.classList.toggle('bg-emerald-900', active);
      ref.current.classList.toggle('bg-emerald-950', !active);
    };
    apply(availableColRef, col === 'available');
    apply(playingColRef, col === 'playing');
  }

  function handlePointerDown(e, player) {
    if (startRef.current) return;
    const rect = e.currentTarget.getBoundingClientRect();
    startRef.current = {
      x: e.clientX,
      y: e.clientY,
      origLeft: rect.left,
      origTop: rect.top,
      width: rect.width,
      height: rect.height,
      moved: false,
      pointerId: e.pointerId,
      player,
    };
    try {
      e.currentTarget.setPointerCapture(e.pointerId);
    } catch (err) {}
  }

  function handlePointerMove(e, player) {
    const s = startRef.current;
    if (!s || s.player.id !== player.id) return;
    const dx = e.clientX - s.x;
    const dy = e.clientY - s.y;

    if (!s.moved) {
      if (Math.abs(dx) + Math.abs(dy) < 6) return;
      s.moved = true;
      setDraggingPlayer({ ...player, width: s.width, height: s.height });
    }

    if (ghostRef.current) {
      ghostRef.current.style.transform = `translate(${s.origLeft + dx}px, ${s.origTop + dy}px)`;
    }
    const col = getColumnAt(e.clientX, e.clientY);
    setColumnHighlight(col);
  }

  function handlePointerUp(e, player) {
    const s = startRef.current;
    if (!s || s.player.id !== player.id) return;
    try {
      e.currentTarget.releasePointerCapture(s.pointerId);
    } catch (err) {}

    if (s.moved) {
      const col = getColumnAt(e.clientX, e.clientY);
      if (col && col !== player.status) movePlayer(player.id, col);
    } else {
      movePlayer(player.id, player.status === 'available' ? 'playing' : 'available');
    }

    setColumnHighlight(null);
    setDraggingPlayer(null);
    startRef.current = null;
  }

  const available = players.filter((p) => p.status === 'available');
  const playing = players.filter((p) => p.status === 'playing');
  const availableByTier = TIERS.reduce((acc, t) => {
    acc[t] = available.filter((p) => p.tier === t);
    return acc;
  }, {});

  function renderCard(player, centered) {
    const hidden = draggingPlayer && draggingPlayer.id === player.id;
    return (
      <div
        key={player.id}
        onPointerDown={(e) => handlePointerDown(e, player)}
        onPointerMove={(e) => handlePointerMove(e, player)}
        onPointerUp={(e) => handlePointerUp(e, player)}
        onPointerCancel={(e) => handlePointerUp(e, player)}
        className={`group flex items-center gap-2 rounded-md border px-3 py-2.5 select-none touch-none cursor-grab active:cursor-grabbing border-emerald-800 bg-emerald-900 hover:border-emerald-600 ${
          hidden ? 'opacity-0' : 'opacity-100'
        }`}
      >
        <button
          onPointerDown={(e) => e.stopPropagation()}
          onClick={() => cycleTier(player.id)}
          title="Tap to change tier"
          className={`flex h-6 w-6 shrink-0 items-center justify-center rounded text-xs font-bold ${TIER_BADGE_CLASS[player.tier]}`}
          style={{ fontFamily: "'Bebas Neue', sans-serif" }}
        >
          {player.tier}
        </button>
        <span
          className="flex h-7 w-7 shrink-0 items-center justify-center rounded-full bg-emerald-700 text-sm font-bold text-stone-100"
          style={{ fontFamily: "'Bebas Neue', sans-serif", fontSize: '0.95rem' }}
        >
          {player.number}
        </span>
        <span className={`flex-1 break-words text-sm text-stone-100 ${centered ? 'text-center' : ''}`}>{player.name}</span>
        <Icon className="h-3.5 w-3.5 shrink-0 text-emerald-600 opacity-0 group-hover:opacity-100 text-xs">⇄</Icon>
        <button
          onPointerDown={(e) => e.stopPropagation()}
          onClick={() => removePlayer(player.id)}
          className="shrink-0 rounded p-1 text-emerald-700 hover:bg-emerald-800 hover:text-stone-100"
          aria-label={`Remove ${player.name}`}
        >
          <Icon className="h-3.5 w-3.5 text-xs">✕</Icon>
        </button>
      </div>
    );
  }

  return (
    <div
      className="flex min-h-dvh w-full flex-col bg-emerald-950 p-4 pb-10 text-stone-100"
      style={{ fontFamily: "'Inter', ui-sans-serif, system-ui, sans-serif" }}
    >
      <div>
        <h1
          className="text-3xl leading-none tracking-wide text-stone-100"
          style={{ fontFamily: "'Bebas Neue', sans-serif" }}
        >
          LINEUP BUILDER
        </h1>
        <p className="mt-1 text-xs uppercase tracking-widest text-emerald-500">
          Tap a name, or drag it down, to set who's playing
        </p>
      </div>

      <div className="mt-3 flex flex-wrap items-center justify-end gap-2 border-t border-emerald-700 pt-2">
        <button
          onClick={copyRoster}
          className="flex items-center gap-1 rounded-md border border-emerald-700 px-2.5 py-1.5 text-xs text-emerald-400 hover:border-amber-400 hover:text-amber-400"
        >
          <Icon className="h-3 w-3 text-[10px]">{copyState === 'copied' ? '✓' : '⧉'}</Icon>
          {copyState === 'copied' ? 'Copied' : copyState === 'error' ? "Couldn't copy" : 'Copy list'}
        </button>
        <button
          onClick={() => setShowImport((v) => !v)}
          className="flex items-center gap-1 rounded-md border border-emerald-700 px-2.5 py-1.5 text-xs text-emerald-400 hover:border-amber-400 hover:text-amber-400"
        >
          <Icon className="h-3 w-3 text-[10px]">⎘</Icon>
          Paste list
        </button>
        <button
          onClick={resetAll}
          className="flex items-center gap-1 rounded-md border border-emerald-700 px-2.5 py-1.5 text-xs text-emerald-400 hover:border-amber-400 hover:text-amber-400"
        >
          <Icon className="h-3 w-3 text-[10px]">↺</Icon>
          Reset
        </button>
      </div>

      {showImport && (
        <div className="mt-2 flex flex-col gap-2 rounded-md border border-emerald-800 bg-emerald-900 p-2">
          <textarea
            value={importText}
            onChange={(e) => setImportText(e.target.value)}
            placeholder="Paste a previously copied list here"
            rows={4}
            className="w-full resize-none rounded border border-emerald-700 bg-emerald-950 p-2 text-xs text-stone-100 placeholder-emerald-600 outline-none focus:border-amber-400"
          />
          <p className="text-[11px] text-emerald-600">This replaces the current roster with the pasted one.</p>
          <div className="flex justify-end gap-2">
            <button
              onClick={() => {
                setShowImport(false);
                setImportText('');
              }}
              className="rounded px-3 py-1.5 text-xs text-emerald-500 hover:text-stone-100"
            >
              Cancel
            </button>
            <button
              onClick={restoreFromText}
              disabled={!importText.trim()}
              className="rounded bg-amber-400 px-3 py-1.5 text-xs font-bold text-emerald-800 disabled:opacity-40"
            >
              Restore
            </button>
          </div>
        </div>
      )}

      <div className="mt-4 flex gap-2">
        <input
          value={newName}
          onChange={(e) => setNewName(e.target.value)}
          onKeyDown={(e) => e.key === 'Enter' && addPlayer()}
          placeholder="Add a player name"
          className="flex-1 min-w-0 rounded-md border border-emerald-700 bg-emerald-900 px-3 py-2 text-sm text-stone-100 placeholder-emerald-600 caret-white outline-none focus:border-amber-400"
        />
        <div className="flex shrink-0 overflow-hidden rounded-md border border-emerald-700">
          {TIERS.map((t) => (
            <button
              key={t}
              onClick={() => setNewTier(t)}
              className={`w-8 py-2 text-sm font-bold ${
                newTier === t ? TIER_BADGE_CLASS[t] : 'bg-emerald-900 text-emerald-500'
              }`}
              style={{ fontFamily: "'Bebas Neue', sans-serif" }}
            >
              {t}
            </button>
          ))}
        </div>
        <button
          onClick={addPlayer}
          disabled={!newName.trim()}
          className="flex shrink-0 items-center gap-1 rounded-md bg-amber-400 px-3 py-2 text-sm font-bold text-emerald-800 disabled:opacity-40"
        >
          <Icon className="h-4 w-4 text-sm">+</Icon>
          ADD
        </button>
      </div>

      {/* AVAILABLE */}
      <div
        ref={availableColRef}
        data-column="available"
        className="mt-4 flex flex-col rounded-lg border-2 border-dashed border-emerald-800 bg-emerald-950 p-3"
      >
        <div className="flex items-center justify-between px-1 pb-2">
          <span className="text-xs font-semibold uppercase tracking-widest text-emerald-500">Available</span>
          <span className="text-xs text-emerald-600">{available.length}</span>
        </div>
        <div className="flex flex-col gap-5 py-1">
          {available.length === 0 && (
            <p className="mt-2 px-1 text-xs text-emerald-700">No players yet — add some above.</p>
          )}
          {TIERS.map((t) =>
            availableByTier[t].length > 0 ? (
              <div key={t} className="flex flex-col gap-3">
                <div className={`px-1 text-center text-[11px] font-bold uppercase tracking-widest ${TIER_HEADER_CLASS[t]}`}>
                  {t} · {TIER_LABEL[t]}
                </div>
                {availableByTier[t].map((p) => renderCard(p, true))}
              </div>
            ) : null
          )}
          {available.length > 4 && (
            <button
              onClick={() => window.scrollTo({ top: 0, behavior: 'smooth' })}
              className="mt-1 flex shrink-0 items-center justify-center gap-1 rounded-md border border-emerald-800 py-1.5 text-xs text-emerald-600 hover:border-amber-400 hover:text-amber-400"
            >
              <Icon className="h-3.5 w-3.5 text-xs">↑</Icon>
              Back to top
            </button>
          )}
        </div>
      </div>

      {/* PLAYING */}
      <div
        ref={playingColRef}
        data-column="playing"
        className="mt-4 flex flex-col rounded-lg border-2 border-dashed border-emerald-800 bg-emerald-950 p-3"
      >
        <div className="flex items-center justify-between px-1 pb-2">
          <span className="text-xs font-semibold uppercase tracking-widest text-amber-400">Playing</span>
          <span className="text-xs text-emerald-600">{playing.length}</span>
        </div>
        <button
          onClick={refreshFoursomes}
          disabled={playing.length === 0}
          className="mb-2 flex items-center justify-center gap-1 rounded-md border border-emerald-700 py-1.5 text-xs text-emerald-500 hover:border-amber-400 hover:text-amber-400 disabled:opacity-30"
        >
          <Icon className="h-3.5 w-3.5 text-xs">👥</Icon>
          Build Foursomes
        </button>
        <div className="flex flex-col gap-2 py-1">
          {playing.length === 0 && (
            <p className="mt-2 px-1 text-xs text-emerald-700">Drag or tap a player down to add them here.</p>
          )}
          {playing.map(renderCard)}
        </div>
      </div>

      {/* FOURSOMES */}
      <div className="mt-4 flex flex-col rounded-lg border-2 border-dashed border-emerald-800 bg-emerald-950 p-3">
        <div className="flex items-center justify-between px-1 pb-2">
          <span className="text-sm uppercase tracking-widest text-stone-100" style={{ fontFamily: "'Bebas Neue', sans-serif" }}>
            Foursomes
          </span>
          <button
            onClick={refreshFoursomes}
            disabled={playing.length === 0}
            className="flex items-center gap-1 text-xs text-emerald-500 hover:text-amber-400 disabled:opacity-30"
          >
            <Icon className="h-3.5 w-3.5 text-xs">🔀</Icon>
            Re-shuffle
          </button>
        </div>

        {foursomes.length === 0 ? (
          <p className="mt-2 px-1 text-xs text-emerald-700">Tap Build Foursomes above once you've got players in Playing.</p>
        ) : (
          <div className="mt-1 flex flex-col gap-3">
            {foursomes.map((group, idx) => (
              <div key={idx} className="rounded-lg border border-emerald-800 p-3">
                <div className="flex items-center justify-between border-b border-emerald-700 pb-2">
                  <span className="text-sm uppercase tracking-widest text-amber-400" style={{ fontFamily: "'Bebas Neue', sans-serif" }}>
                    Foursome {idx + 1}
                  </span>
                  <span className="text-[11px] text-emerald-600">{group.length} players</span>
                </div>
                <div className="mt-2 flex flex-col gap-1.5">
                  {group.map((p) => (
                    <div key={p.id} className="flex items-center gap-2">
                      <span
                        className={`flex h-5 w-5 shrink-0 items-center justify-center rounded text-[11px] font-bold ${TIER_BADGE_CLASS[p.tier]}`}
                        style={{ fontFamily: "'Bebas Neue', sans-serif" }}
                      >
                        {p.tier}
                      </span>
                      <span className="text-sm text-stone-100">{p.name}</span>
                    </div>
                  ))}
                </div>
              </div>
            ))}
            <button
              onClick={copySheet}
              className="flex items-center justify-center gap-1 rounded-md border border-emerald-700 py-2 text-xs text-emerald-500 hover:border-amber-400 hover:text-amber-400"
            >
              <Icon className="h-3.5 w-3.5 text-xs">{sheetCopyState === 'copied' ? '✓' : '⧉'}</Icon>
              {sheetCopyState === 'copied' ? 'Copied' : sheetCopyState === 'error' ? "Couldn't copy" : 'Copy sheet'}
            </button>
          </div>
        )}
      </div>

      {draggingPlayer && (
        <div
          ref={ghostRef}
          style={{
            position: 'fixed',
            left: 0,
            top: 0,
            width: draggingPlayer.width,
            height: draggingPlayer.height,
            transform: `translate(${startRef.current ? startRef.current.origLeft : 0}px, ${
              startRef.current ? startRef.current.origTop : 0
            }px)`,
          }}
          className="z-50 flex -rotate-2 scale-105 items-center gap-2 rounded-md border-2 border-amber-400 bg-emerald-800 px-3 py-2.5 shadow-2xl pointer-events-none"
        >
          <span
            className={`flex h-6 w-6 shrink-0 items-center justify-center rounded text-xs font-bold ${TIER_BADGE_CLASS[draggingPlayer.tier]}`}
            style={{ fontFamily: "'Bebas Neue', sans-serif" }}
          >
            {draggingPlayer.tier}
          </span>
          <span
            className="flex h-7 w-7 shrink-0 items-center justify-center rounded-full bg-emerald-700 text-sm font-bold text-stone-100"
            style={{ fontFamily: "'Bebas Neue', sans-serif" }}
          >
            {draggingPlayer.number}
          </span>
          <span className="flex-1 break-words text-sm font-medium text-stone-100">{draggingPlayer.name}</span>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<RosterBuilder />);
</script>
</body>
</html>
